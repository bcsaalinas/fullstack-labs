<!DOCTYPE html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="utf-8" />
    <title>Dicee</title>
    <link rel="stylesheet" href="styles.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DynaPuff:wght@400..700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div class="container">
      <div class="frame">
        <header class="top-block">
          <h1 class="title">Click the Button!</h1>
        </header>

        <main class="middle-block">
          <section class="column player">
            <img
              src="images/dice1.png"
              alt="Dice for player 1"
              class="dice-image"
            />
            <h2 class="player-label">Player 1</h2>
          </section>

          <section class="column player">
            <img
              src="images/dice2.png"
              alt="Dice for player 2"
              class="dice-image"
            />
            <h2 class="player-label">Player 2</h2>
          </section>
        </main>
        <div class="button-container">
          <button class="roll">Roll dice</button>
        </div>

        <footer class="bottom-block">
          <a href="https://github.com/bcsaalinas">Check out my github!</a>
        </footer>
      </div>
    </div>

    <script src="index.js"></script>
  </body>
</html>
