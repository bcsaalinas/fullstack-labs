<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FlexboxShowcase</title>
    <style>
      .container {
        display: flex;
        gap: 10px;
        width: 80%;
        background-color: #ddd;
        padding: 20px;
        margin: 2rem;
        justify-content: space-between;
      }
      .card {
        width: 300px;
        height: 300px;
        background-color: rgb(255, 255, 255);
        border: 2px solid black;
      }

      .container > * {
        background-color: #4285f4;
        color: white;
        font-size: 18px;
        padding: 20px;
        border: 2px solid white;
        max-height: 50px;
      }
      .one {
        flex: 0 1 200px;
      }

      .two {
        flex: 0 0 200px;
      }

      .three {
        flex: 1 0 400px;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="card one">
        <p>Item 1: 200px</p>
      </div>

      <div class="card two">
        <p>Item 2: 200px</p>
      </div>
      <div class="card three">
        <p>Item 3: 400px</p>
      </div>
    </div>
  </body>
</html>
